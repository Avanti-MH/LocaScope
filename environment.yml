# LocaScope conda environment (精簡版，取代 LocaScope/environment.yml 的 gigapath env)
#
# 只保留程式碼實際 import 的套件（trace 自 LocaScope/ 下所有 .py）：
#   torch / torchvision        核心；HestSegFunc 用 torchvision.models
#   timm (>=1.0.3)             GigaPath / UNI2 / ConvNeXtV2 / CONCH ViT（hf_hub: 載入）
#   huggingface_hub            timm hf_hub 與 hf_hub_download
#   safetensors                Store / TissueMask / KeypointLabelStore
#   numpy, scipy, scikit-learn, matplotlib, pillow, opencv-python
#   pandas                     utilities/cli/plot/plot_locascope.py 的 join table
#   openslide + openslide-python   WSI 讀取
#   python-dotenv              aiNNModel/*Func.py 讀 HF token
#   wandb                      training/*/Runtime.py、SuperPoint/Trainer.py
#   ruff                       Makefile `make lint`
#
# 移除：CUDA toolkit / ffmpeg / X11 等 conda 系統套件（torch wheel 自帶 CUDA runtime，
# job script 另外 `ml load cuda/12.6`）、flash-attn、xformers、tome、fairscale、monai、
# torchio、torch-geometric、lifelines、scikit-survival、gradio、fastapi、transformers、
# tensorboard、webdataset 等程式碼沒有 import 的套件。
#
# 版本沿用舊 env；numpy 改為 1.26.4（torch 2.3 以 numpy 1.x 編譯），opencv 隨之用 4.10。
name: locascope
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.9
  - pip
  - openslide=3.4.1
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.3.0+cu121
      - torchvision==0.18.0+cu121
      - timm==1.0.28
      - huggingface-hub==0.20.2
      - safetensors==0.7.0
      - numpy==1.26.4
      - pandas==2.3.3
      - scipy==1.13.1
      - scikit-learn==1.5.2
      - matplotlib==3.9.4
      - pillow==10.4.0
      - opencv-python==4.10.0.84
      - openslide-python==1.4.2
      - python-dotenv==1.2.1
      - wandb==0.26.0
      - ruff==0.15.12
